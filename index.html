<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaHub - Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; }
        .card:hover { transform: scale(1.05); transition: 0.3s; }
    </style>
</head>
<body>
    <nav class="p-4 bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-500">DRAMA<span class="text-white">HUB</span></h1>
            <input id="search" type="text" placeholder="Cari..." class="bg-gray-800 rounded-full px-4 py-1 text-sm border border-gray-700">
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <h2 class="text-xl font-bold mb-6 border-l-4 border-blue-500 pl-3">Drama Populer</h2>
        <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <p id="msg" class="col-span-full text-center text-gray-500 text-sm">Menghubungkan ke server...</p>
        </div>
    </div>

    <div id="player" class="fixed inset-0 bg-black/95 hidden z-[100] flex flex-col items-center justify-center p-4">
        <button onclick="closePlayer()" class="self-end text-3xl mb-4">&times; Tutup</button>
        <div class="w-full max-w-4xl aspect-video bg-gray-800 rounded-lg overflow-hidden">
            <iframe id="videoFrame" src="" class="w-full h-full" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Data cadangan jika API gagal/lambat
        const fallbackData = [
            { id: 110356, name: "Hidden Love", poster_path: "/66Y9Hbt9oqY99I00S9Yn9Yn.jpg" },
            { id: 114410, name: "Who Rules The World", poster_path: "/ov706S6I6pSS6S6I6pS.jpg" }
        ];

        async function init() {
            const grid = document.getElementById('grid');
            const msg = document.getElementById('msg');
            
            try {
                // Menggunakan API publik gratis untuk testing
                const res = await fetch('https://api.themoviedb.org/3/trending/tv/day?api_key=865409395f87b353f86e39f37920155b');
                const data = await res.json();
                render(data.results);
                msg.style.display = 'none';
            } catch (e) {
                console.log("Gagal memuat API, menggunakan data lokal.");
                render(fallbackData);
                msg.innerText = "Mode Offline Aktif";
            }
        }

        function render(items) {
            const grid = document.getElementById('grid');
            grid.innerHTML = items.map(item => `
                <div class="card bg-gray-900 rounded-lg overflow-hidden cursor-pointer shadow-xl" onclick="play(${item.id})">
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" class="w-full h-64 object-cover">
                    <div class="p-3 text-sm font-bold truncate">${item.name || item.title}</div>
                </div>
            `).join('');
        }

        function play(id) {
            document.getElementById('player').classList.remove('hidden');
            // Link player universal
            document.getElementById('videoFrame').src = `https://vidsrc.to/embed/tv/${id}`;
        }

        function closePlayer() {
            document.getElementById('player').classList.add('hidden');
            document.getElementById('videoFrame').src = "";
        }

        init();
    </script>
</body>
</html>
