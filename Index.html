<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraK21 - Streaming C-Drama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Inter', sans-serif; }
        .movie-card:hover img { transform: scale(1.05); transition: 0.3s; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="p-4 bg-gray-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-500 tracking-tighter">DRAMA<span class="text-white">HUB</span></h1>
            <div class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="#" class="text-blue-400">Home</a>
                <a href="#" class="hover:text-blue-400">C-Drama</a>
                <a href="#" class="hover:text-blue-400">Movies</a>
                <a href="#" class="hover:text-blue-400">Trending</a>
            </div>
            <input id="searchInput" type="text" placeholder="Cari drama..." class="bg-gray-800 text-sm rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-40 md:w-64">
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-4">
        <div class="relative rounded-3xl overflow-hidden h-[300px] bg-gradient-to-r from-blue-900 to-black flex items-center p-8">
            <div class="relative z-10 max-w-lg">
                <span class="bg-blue-600 text-[10px] font-bold px-2 py-1 rounded mb-4 inline-block">TRENDING SEKARANG</span>
                <h2 class="text-4xl font-bold mb-2">Eksplorasi Drama Asia</h2>
                <p class="text-gray-300 text-sm mb-6">Temukan ribuan judul drama China, Korea, dan Jepang terbaru dengan kualitas terbaik.</p>
                <button class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full font-semibold transition">Tonton Sekarang</button>
            </div>
            <div class="absolute right-0 top-0 h-full w-1/2 bg-[url('https://source.unsplash.com/random/800x600?cinema')] bg-cover opacity-30 hidden md:block"></div>
        </div>
    </div>

    <main class="container mx-auto p-4">
        <h3 class="text-xl font-bold mb-6 flex items-center">
            <span class="w-1 h-6 bg-blue-500 mr-3"></span> Drama Populer
        </h3>
        
        <div id="loader" class="flex justify-center my-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
        </div>

        <div id="dramaGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            </div>
    </main>

    <script>
        // API Key dari TMDB (Gunakan API Key publik untuk contoh ini)
        const API_KEY = '865409395f87b353f86e39f37920155b'; // API Key contoh
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        const dramaGrid = document.getElementById('dramaGrid');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('searchInput');

        // Fungsi Ambil Data dari API
        async function getDramas(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                displayDramas(data.results);
            } catch (error) {
                console.error("Gagal mengambil data", error);
            } finally {
                loader.style.display = 'none';
            }
        }

        // Fungsi Menampilkan Card ke HTML
        function displayDramas(dramas) {
            dramaGrid.innerHTML = '';
            dramas.forEach(drama => {
                const { name, title, poster_path, vote_average, first_air_date } = drama;
                const card = document.createElement('div');
                card.className = 'movie-card bg-gray-900 rounded-xl overflow-hidden cursor-pointer shadow-lg hover:shadow-blue-900/20 transition-all';
                card.innerHTML = `
                    <div class="relative overflow-hidden">
                        <img src="${poster_path ? IMG_URL + poster_path : 'https://via.placeholder.com/500x750'}" alt="${name || title}" class="w-full h-72 object-cover">
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-yellow-400 text-xs font-bold">
                            ★ ${vote_average.toFixed(1)}
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-sm truncate">${name || title}</h4>
                        <p class="text-gray-500 text-[10px] mt-1 uppercase tracking-widest">${first_air_date ? first_air_date.split('-')[0] : 'N/A'}</p>
                    </div>
                `;
                dramaGrid.appendChild(card);
            });
        }

        // Jalankan saat pertama dibuka (Ambil TV Shows Populer - Banyak C-Drama di sini)
        getDramas(`${BASE_URL}/discover/tv?api_key=${API_KEY}&with_original_language=zh&sort_by=popularity.desc`);

        // Fitur Search
        searchInput.addEventListener('keyup', (e) => {
            const query = e.target.value;
            if(query) {
                getDramas(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${query}`);
            }
        });
    </script>
</body>
</html>
