<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaHub - Nonton Drama China & Asia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; }
        .card-shadow:hover { box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5); transform: translateY(-5px); transition: all 0.3s; }
    </style>
</head>
<body>

    <nav class="p-4 bg-slate-900 sticky top-0 z-50 border-b border-slate-800">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-500">DRAMA<span class="text-white">HUB</span></h1>
            <div class="space-x-6 hidden md:flex">
                <a href="#" class="hover:text-blue-400">Home</a>
                <a href="#" class="hover:text-blue-400">Drama China</a>
                <a href="#" class="hover:text-blue-400">Movie</a>
                <a href="#" class="hover:text-blue-400">Popular</a>
            </div>
            <div class="relative">
                <input type="text" placeholder="Cari drama..." class="bg-slate-800 rounded-full px-4 py-1 focus:outline-none border border-slate-700">
            </div>
        </div>
    </nav>

    <header class="container mx-auto mt-6 p-4">
        <div class="bg-gradient-to-r from-blue-700 to-indigo-900 rounded-2xl p-8 h-64 flex items-center">
            <div>
                <h2 class="text-4xl font-bold mb-2">Hidden Love (2023)</h2>
                <p class="text-slate-200 mb-4">Tonton episode terbaru dengan subtitle Indonesia.</p>
                <button class="bg-white text-blue-900 px-6 py-2 rounded-lg font-bold hover:bg-blue-100">Mulai Nonton</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-semibold border-l-4 border-blue-500 pl-3">Update Terbaru</h3>
            <a href="#" class="text-blue-400 text-sm">Lihat Semua</a>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <div class="card-shadow bg-slate-800 rounded-lg overflow-hidden cursor-pointer">
                <div class="relative">
                    <img src="https://via.placeholder.com/300x450" alt="Poster" class="w-full h-64 object-cover">
                    <span class="absolute top-2 left-2 bg-blue-600 text-xs px-2 py-1 rounded">EP 12</span>
                </div>
                <div class="p-3">
                    <h4 class="font-medium text-sm truncate">The Untamed</h4>
                    <p class="text-slate-400 text-xs mt-1 italic">Wuxia, Fantasy</p>
                </div>
            </div>

            <div class="card-shadow bg-slate-800 rounded-lg overflow-hidden cursor-pointer">
                <div class="relative">
                    <img src="https://via.placeholder.com/300x450" alt="Poster" class="w-full h-64 object-cover">
                    <span class="absolute top-2 left-2 bg-green-600 text-xs px-2 py-1 rounded">Movie</span>
                </div>
                <div class="p-3">
                    <h4 class="font-medium text-sm truncate">Love Like The Galaxy</h4>
                    <p class="text-slate-400 text-xs mt-1 italic">Romance, Historical</p>
                </div>
            </div>

            </div>
    </main>

    <footer class="mt-12 p-8 bg-slate-900 border-t border-slate-800 text-center">
        <p class="text-slate-500 text-sm">© 2024 DraK21</p>
    </footer>

</body>
</html>
